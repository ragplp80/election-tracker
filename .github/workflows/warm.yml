# Keeps the server's race list warm. Building it from scratch takes a minute or two, and that
# happens when nobody has opened the page for a while, so the first refresh after a quiet stretch
# was slow. Asking for it every 10 minutes (which also records a point in the shared trend history) means a viewer almost never waits for a rebuild.
name: keep warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Race list and prices
        run: |
          for path in api/catalog api/snapshot api/votes; do
            curl -sS -o /dev/null -D headers.txt --max-time 300 -w "$path %{http_code} %{time_total}s\n" "https://election-tracker-indol.vercel.app/$path" || true
            grep -iE '^(x-vercel-cache|server-timing|x-tracker-stats|age):' headers.txt || true
          done
