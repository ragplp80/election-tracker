<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Election Tracker · Connection Test</title>
<style>
  :root{--bg:#f6f7f9;--fg:#15181d;--muted:#5d6672;--ok:#1f7a4d;--bad:#b42318;--card:#fff;--line:#dde1e6}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8ebef;--muted:#98a2ae;--ok:#4cc38a;--bad:#ff6b5e;--card:#1a1e24;--line:#2b313a;color-scheme:dark}}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left))}
  main{max-width:760px;margin:0 auto;display:grid;gap:16px}
  h1{font-size:22px;margin:0}
  h2{font-size:15px;margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.muted{color:var(--muted)}
  button{font:inherit;font-weight:600;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:var(--fg);color:var(--bg)}
  textarea{width:100%;box-sizing:border-box;height:160px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>Election Tracker: connection test</h1>
  <p class="muted">Tests each data route for live election prices. When it finishes, tap <b>Copy report</b> and paste it back to Claude.</p>
  <div class="card"><h2 id="kalshiTitle">Kalshi</h2><div id="kalshi"></div></div>
  <div class="card"><h2>Polymarket (direct, no relay)</h2><div id="poly"></div></div>
  <div class="card">
    <button id="copy" disabled>Copy report</button>
    <p id="copied" class="muted"></p>
    <textarea id="report" readonly></textarea>
  </div>
</main>
<script>
const VERSION='v5-vercel';
const onVercel=location.hostname.endsWith('vercel.app');
const CF='https://election-tracker.m4rf2jgjwt.workers.dev';
const route=onVercel?'vercel':'cloudflare';
const kalshiUrl=p=>onVercel?'/api/kalshi?path='+encodeURIComponent(p):CF+p;
document.getElementById('kalshiTitle').textContent='Kalshi via '+(onVercel?'Vercel relay':'Cloudflare relay');

const report={version:VERSION,route,host:location.hostname,ranAt:new Date().toISOString(),ua:navigator.userAgent,kalshi:{},poly:{},calls:[]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function line(box,label,ok,detail){const d=document.createElement('div');d.className='row';d.innerHTML=`<span>${label}</span><span class="${ok?'ok':'bad'}">${ok?'OK':'Failed'} <span class="muted">${detail||''}</span></span>`;document.getElementById(box).appendChild(d)}
async function getJSON(url,tag){
  await sleep(300);
  const r=await fetch(url,{headers:{accept:'application/json'}});
  report.calls.push([tag,url.slice(0,70),r.status,r.headers.get('x-relay-attempts')]);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function slim(o){
  if(Array.isArray(o))return o.slice(0,2).map(slim);
  if(o&&typeof o==='object'){const n={};for(const k in o){const v=o[k];n[k]=typeof v==='string'&&v.length>100?v.slice(0,100)+'…':slim(v)}return n}
  return o;
}
async function step(box,store,name,fn){
  const t=performance.now();
  try{const res=await fn();const ms=Math.round(performance.now()-t);report[store][name]={ok:true,ms,...res};line(box,name,true,ms+' ms');return res}
  catch(e){report[store][name]={ok:false,error:String(e)};line(box,name,false,String(e));return null}
}

async function kalshi(){
  const k=(p)=>getJSON(kalshiUrl(p),'kalshi');
  await step('kalshi','kalshi','Exchange status',async()=>({status:(await k('/exchange/status')).exchange_active}));
  await step('kalshi','kalshi','Senate control',async()=>{const j=await k('/events?series_ticker=CONTROLS&with_nested_markets=true&status=open');return{events:(j.events||[]).length,sample:slim((j.events||[])[0])}});
  await step('kalshi','kalshi','House control',async()=>{const j=await k('/events?series_ticker=CONTROLH&with_nested_markets=true&status=open');return{events:(j.events||[]).length,markets:((j.events||[])[0]?.markets||[]).map(m=>[m.ticker,m.yes_sub_title||m.subtitle,m.last_price_dollars??m.last_price])}});
  await step('kalshi','kalshi','Texas Senate',async()=>{const j=await k('/events?series_ticker=SENATETX&with_nested_markets=true&status=open');return{events:(j.events||[]).map(e=>e.event_ticker),markets:((j.events||[])[0]?.markets||[]).map(m=>[m.ticker,m.yes_sub_title||m.subtitle,m.last_price_dollars??m.last_price,m.volume_fp??m.volume])}});
  await step('kalshi','kalshi','Arizona Governor',async()=>{const j=await k('/events?series_ticker=GOVPARTYAZ&with_nested_markets=true&status=open');return{events:(j.events||[]).map(e=>e.event_ticker),markets:((j.events||[])[0]?.markets||[]).map(m=>[m.ticker,m.yes_sub_title||m.subtitle,m.last_price_dollars??m.last_price])}});
  await step('kalshi','kalshi','PA-7 House',async()=>{const j=await k('/events?series_ticker=HOUSEPA7&with_nested_markets=true&status=open');return{events:(j.events||[]).map(e=>e.event_ticker),markets:((j.events||[])[0]?.markets||[]).map(m=>[m.ticker,m.yes_sub_title||m.subtitle,m.last_price_dollars??m.last_price])}});
  await step('kalshi','kalshi','Batch: markets for several events',async()=>{
    const j=await k('/markets?event_ticker=CONTROLS-2026,CONTROLH-2026,SENATETX-26,GOVPARTYAZ-26&limit=100');
    return{count:(j.markets||[]).length,tickers:(j.markets||[]).map(m=>m.ticker)};
  });
  await step('kalshi','kalshi','Price history',async()=>{
    const end=Math.floor(Date.now()/1000),start=end-3600*6;
    const j=await k(`/series/CONTROLS/markets/CONTROLS-2026-R/candlesticks?start_ts=${start}&end_ts=${end}&period_interval=60`);
    return{points:(j.candlesticks||[]).length,sample:slim(j.candlesticks)};
  });
  await step('kalshi','kalshi','10 quick calls in a row',async()=>{
    const series=['SENATEGA','SENATENC','SENATEMI','SENATEME','SENATEOH','SENATEIA','SENATENH','SENATEAK','SENATENE','SENATEMN'];
    let ok=0,codes=[];
    for(const s of series){try{await k('/events?series_ticker='+s+'&with_nested_markets=true&status=open');ok++;codes.push(200)}catch(e){codes.push(String(e))}}
    if(ok<series.length)throw new Error(ok+'/'+series.length+' succeeded '+codes.join(','));
    return{ok};
  });
}

async function poly(){
  const G='https://gamma-api.polymarket.com';
  const re=/senate|house|governor|midterm|congress/i;
  await step('poly','poly','Reach Polymarket',async()=>{
    const j=await getJSON(G+'/events?closed=false&limit=200&order=volume&ascending=false','poly');
    const hits=j.filter(e=>re.test(e.title||'')).map(e=>[e.slug,e.title,(e.markets||[]).length]);
    return{events:j.length,electionEvents:hits.length,sample:hits.slice(0,40)};
  });
  await step('poly','poly','Search 2026 Senate races',async()=>{
    const j=await getJSON(G+'/public-search?q='+encodeURIComponent('2026 Senate election')+'&limit_per_type=25','poly');
    const ev=(j.events||[]).map(e=>[e.slug,e.title,(e.markets||[]).length,slim((e.markets||[])[0])?.outcomePrices]);
    return{events:ev.length,sample:ev.slice(0,25)};
  });
}

(async()=>{
  await kalshi();
  await poly();
  const txt=JSON.stringify(report);
  const ta=document.getElementById('report');ta.value=txt;
  const b=document.getElementById('copy');b.disabled=false;
  b.onclick=async()=>{try{await navigator.clipboard.writeText(txt);document.getElementById('copied').textContent='Copied '+Math.round(txt.length/1024)+' KB. Paste it into the chat.'}catch(e){ta.select();document.getElementById('copied').textContent='Copy failed. Select all in the box below and copy.'}};
})();
</script>
</body>
</html>
