<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Election Tracker · Connection Test</title>
<style>
  :root{--bg:#f6f7f9;--fg:#15181d;--muted:#5d6672;--ok:#1f7a4d;--bad:#b42318;--card:#fff;--line:#dde1e6}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8ebef;--muted:#98a2ae;--ok:#4cc38a;--bad:#ff6b5e;--card:#1a1e24;--line:#2b313a;color-scheme:dark}}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left))}
  main{max-width:760px;margin:0 auto;display:grid;gap:16px}
  h1{font-size:22px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.muted{color:var(--muted)}
  button{font:inherit;font-weight:600;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:var(--fg);color:var(--bg)}
  textarea{width:100%;box-sizing:border-box;height:160px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>Election Tracker: connection test</h1>
  <p class="muted">Checks whether this page can read Kalshi directly, and maps the election markets. When it finishes, tap <b>Copy report</b> and paste it back to Claude.</p>
  <div class="card" id="checks"></div>
  <div class="card" id="prices"><b>Live sample prices</b><div id="sample" class="muted">Loading…</div></div>
  <div class="card">
    <button id="copy" disabled>Copy report</button>
    <p id="copied" class="muted"></p>
    <textarea id="report" readonly></textarea>
  </div>
</main>
<script>
// Use the relay if one is given as ?relay=https://... (remembered on this device).
let RELAY=new URLSearchParams(location.search).get('relay');
try{if(RELAY)localStorage.setItem('relay',RELAY);else RELAY=localStorage.getItem('relay')}catch(e){}
const API=(RELAY?RELAY.replace(/\/+$/,''):'https://api.elections.kalshi.com/trade-api/v2');
const checks=document.getElementById('checks');
const report={ranAt:new Date().toISOString(),ua:navigator.userAgent,steps:{}};
function line(label,ok,detail){const d=document.createElement('div');d.className='row';d.innerHTML=`<span>${label}</span><span class="${ok?'ok':'bad'}">${ok?'OK':'Failed'} <span class="muted">${detail||''}</span></span>`;checks.appendChild(d)}
async function get(path){const r=await fetch(API+path,{headers:{accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function slim(o,depth=0){ // keep structure, shorten arrays
  if(Array.isArray(o))return o.slice(0,2).map(x=>slim(x,depth+1));
  if(o&&typeof o==='object'){const n={};for(const k in o){const v=o[k];n[k]=typeof v==='string'&&v.length>120?v.slice(0,120)+'…':slim(v,depth+1)}return n}
  return o;
}
async function step(name,fn){
  const t=performance.now();
  try{const res=await fn();report.steps[name]={ok:true,ms:Math.round(performance.now()-t),...res};line(name,true,Math.round(performance.now()-t)+' ms');return res}
  catch(e){report.steps[name]={ok:false,error:String(e)};line(name,false,String(e));return null}
}
(async()=>{
  const basic=await step('Reach Kalshi from this browser',async()=>{const j=await get('/exchange/status');return{status:j}});
  if(!basic){document.getElementById('sample').textContent='Blocked. The browser could not read Kalshi directly, so we will need the relay fallback.';}
  else{
    const re=/senate|house|governor|gubernatorial|control|congress/i;
    for(const cat of ['Elections','Politics']){
      await step('List '+cat+' series',async()=>{
        const j=await get('/series?category='+encodeURIComponent(cat));
        const all=j.series||[];
        const hits=all.filter(s=>re.test(s.title||'')||re.test(s.ticker||'')).map(s=>[s.ticker,s.title]);
        return{total:all.length,matching:hits.length,series:hits,sampleSeries:slim(all[0])};
      });
    }
    const ev=await step('Senate control event',async()=>{
      const j=await get('/events?series_ticker=CONTROLS&with_nested_markets=true&status=open');
      return{count:(j.events||[]).length,sampleEvent:slim((j.events||[])[0]),cursor:!!j.cursor};
    });
    await step('Texas Senate (party market)',async()=>{
      const j=await get('/events?series_ticker=SENATETX&with_nested_markets=true');
      return{sampleEvent:slim((j.events||[])[0])};
    });
    await step('Michigan Senate (candidate market)',async()=>{
      const j=await get('/events?series_ticker=KXMISENATE&with_nested_markets=true');
      return{sampleEvent:slim((j.events||[])[0])};
    });
    await step('Market detail',async()=>{const j=await get('/markets/CONTROLS-2026-R');return{market:slim(j.market)}});
    await step('Markets by event list',async()=>{
      const j=await get('/markets?event_ticker=CONTROLS-2026,SENATETX-26&limit=50');
      return{count:(j.markets||[]).length,tickers:(j.markets||[]).map(m=>m.ticker)};
    });
    await step('Price history (candlesticks)',async()=>{
      const end=Math.floor(Date.now()/1000),start=end-3600*6;
      const j=await get(`/series/CONTROLS/markets/CONTROLS-2026-R/candlesticks?start_ts=${start}&end_ts=${end}&period_interval=60`);
      return{points:(j.candlesticks||[]).length,sample:slim(j.candlesticks)};
    });
    try{
      const m=(await get('/markets?event_ticker=CONTROLS-2026,CONTROLH-2026&limit=20')).markets||[];
      document.getElementById('sample').innerHTML=m.length?m.map(x=>`<div class="row"><span>${x.title||x.ticker}</span><span>${x.yes_bid_dollars??x.yes_bid??'?'} / ${x.yes_ask_dollars??x.yes_ask??'?'} · last ${x.last_price_dollars??x.last_price??'?'}</span></div>`).join(''):'No markets returned for the control tickers I guessed. The report will show the right ones.';
    }catch(e){document.getElementById('sample').textContent='Sample failed: '+e}
  }
  const txt=JSON.stringify(report);
  const ta=document.getElementById('report');ta.value=txt;
  const b=document.getElementById('copy');b.disabled=false;
  b.onclick=async()=>{try{await navigator.clipboard.writeText(txt);document.getElementById('copied').textContent='Copied '+Math.round(txt.length/1024)+' KB. Paste it into the chat.'}catch(e){ta.select();document.getElementById('copied').textContent='Copy failed. Select all in the box below and copy.'}};
})();
</script>
</body>
</html>
